name = "radar-normativo-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Repository da cui il bot legge archivio e fonti (deve essere pubblica).
GITHUB_REPO = "vincenzopierri197-source/radar-normativo"
GITHUB_BRANCH = "main"

# KV per i filtri di ogni chat. Wrangler crea il namespace da solo al primo deploy.
[[kv_namespaces]]
binding = "STATE"

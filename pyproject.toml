[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-normativo"
version = "0.1.0"
description = "Monitoraggio configurabile di fonti normative ufficiali italiane ed europee"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["feedparser>=6.0.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
radar-normativo = "radar_normativo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: Radar normativo indipendente
on:
  workflow_dispatch:
  schedule:
    # Retry ogni 5 minuti nelle ore UTC che coprono le 08:00 italiane
    # sia con ora legale sia con ora solare. Il marker evita invii doppi.
    - cron: "*/5 6,7 * * *"
permissions:
  contents: write
concurrency:
  group: radar-normativo-collect-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verifica finestra italiana e idempotenza giornaliera
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now="$(TZ=Europe/Rome date +%H%M)"
          today="$(TZ=Europe/Rome date +%F)"
          # Finestra di recupero: dalle 08:00 alle 09:30 italiane.
          if [[ "$now" < "0800" || "$now" > "0930" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fuori dalla finestra di recupero: $now"
            exit 0
          fi
          if [[ -f data/.normative_last_run_date ]] && [[ "$(cat data/.normative_last_run_date)" == "$today" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Radar normativo già eseguito oggi ($today)."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and test
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -e ".[dev]" && pytest

      - name: Collect regulatory feeds
        if: steps.window.outputs.run == 'true'
        run: python -m radar_normativo collect --config config/sources.json --output data/latest.json

      - name: Check required sources
        if: steps.window.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/latest.json").read_text())
          for s in r["source_results"]: print(f"{'OK' if s['ok'] else 'ERRORE'}: {s['name']} — {s.get('items',0)}")
          failed=[s for s in r["source_results"] if not s["ok"] and s.get("required",True)]
          if failed: raise SystemExit(f"{len(failed)} fonti obbligatorie non raggiungibili")
          PY

      - name: Update archive
        if: steps.window.outputs.run == 'true'
        run: python -m radar_normativo archive --latest data/latest.json --archive data/archive.json --new-items data/new_items.json

      - name: Persist archive
        if: steps.window.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update regulatory archive"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "Push fallito dopo 5 tentativi."
                exit 1
              fi
              echo "Push in conflitto, nuovo tentativo ($attempt/5)..."
              sleep "$((attempt * 2))"
            done
          fi

      - name: Send normative daily Telegram briefing
        if: steps.window.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram non configurato: invio saltato."
            exit 1
          fi
          git fetch origin main
          if git cat-file -e origin/main:data/telegram_sent.json 2>/dev/null; then
            git show origin/main:data/telegram_sent.json > data/telegram_sent.json
          else
            printf '{ "schema_version": 1, "sent_ids": {} }\n' > data/telegram_sent.json
          fi
          python -m radar_normativo telegram --input data/new_items.json --ledger data/telegram_sent.json
          git add -f data/telegram_sent.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update Telegram delivery ledger"
            # Evita il push non-fast-forward se il radar finanziario aggiorna main in parallelo.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "Push fallito dopo 5 tentativi."
                exit 1
              fi
              echo "Push in conflitto, nuovo tentativo ($attempt/5)..."
              sleep "$((attempt * 2))"
            done
          fi

      - name: Mark successful daily run
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TZ=Europe/Rome date +%F > data/.normative_last_run_date
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/.normative_last_run_date
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark normative radar daily run"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "Push fallito dopo 5 tentativi."
                exit 1
              fi
              echo "Push in conflitto, nuovo tentativo ($attempt/5)..."
              sleep "$((attempt * 2))"
            done
          else
            echo "Marker giornaliero già aggiornato: nessuna modifica da salvare."
          fi

      - name: Upload scan artifacts
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: radar-normativo-scan
          path: |
            data/latest.json
            data/new_items.json
          if-no-files-found: warn
          retention-days: 14

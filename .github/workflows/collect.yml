name: Collect official feeds

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC; adjust after validating desired local time.
    - cron: "30 5 * * 1-6"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Collect configured feeds
        run: python -m radar_normativo collect --config config/sources.json --output data/latest.json
      - name: Upload scan as artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-normativo-scan
          path: data/latest.json
          if-no-files-found: error
          retention-days: 14

name: Radar normativo indipendente
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,7 * * *"
permissions:
  contents: write
concurrency:
  group: radar-normativo-collect-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Verifica finestra delle 08:00 italiane
        id: window
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" || "$(TZ=Europe/Rome date +%H)" == "08" ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v6
      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -e ".[dev]" && pytest
      - name: Collect regulatory feeds
        if: steps.window.outputs.run == 'true'
        run: python -m radar_normativo collect --config config/sources.json --output data/latest.json
      - name: Check required sources
        if: steps.window.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("data/latest.json").read_text())
          for s in r["source_results"]: print(f"{'OK' if s['ok'] else 'ERRORE'}: {s['name']} — {s.get('items',0)}")
          failed=[s for s in r["source_results"] if not s["ok"] and s.get("required",True)]
          if failed: raise SystemExit(f"{len(failed)} fonti obbligatorie non raggiungibili")
          PY
      - name: Update archive
        if: steps.window.outputs.run == 'true'
        run: python -m radar_normativo archive --latest data/latest.json --archive data/archive.json --new-items data/new_items.json
      - name: Persist archive
        if: steps.window.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if ! git diff --cached --quiet; then git commit -m "data: update regulatory archive"; git push origin HEAD:main; fi
      - name: Send normative daily Telegram briefing
        if: steps.window.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then echo "Telegram non configurato: invio saltato."; exit 0; fi
          git fetch origin main
          if git cat-file -e origin/main:data/telegram_sent.json 2>/dev/null; then git show origin/main:data/telegram_sent.json > data/telegram_sent.json; else printf '{ "schema_version": 1, "sent_ids": {} }\n' > data/telegram_sent.json; fi
          python -m radar_normativo telegram --input data/new_items.json --ledger data/telegram_sent.json
          git add -f data/telegram_sent.json
          if ! git diff --cached --quiet; then git commit -m "data: update Telegram delivery ledger"; git push origin HEAD:main; fi
      - name: Upload scan artifacts
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: radar-normativo-scan
          path: |
            data/latest.json
            data/new_items.json
          if-no-files-found: warn
          retention-days: 14

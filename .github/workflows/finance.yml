name: Radar finanziario indipendente

on:
  workflow_dispatch:
  schedule:
    # Esegue alle 08:10 Europe/Rome sia con ora legale sia con ora solare.
    - cron: "10 6,7 * * *"

permissions:
  contents: read

concurrency:
  group: radar-finanziario-main
  cancel-in-progress: false

jobs:
  financial-briefing:
    runs-on: ubuntu-24.04
    steps:
      - name: Verifica finestra delle 08:10 italiane
        id: window
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" || "$(TZ=Europe/Rome date +%H%M)" == "0810" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.window.outputs.run == 'true'
        run: python -m pip install .

      - name: Send independent financial briefing to Telegram
        if: steps.window.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram non configurato: invio saltato."
            exit 0
          fi
          printf '{"items": []}\n' > /tmp/radar-finanziario-items.json
          python -m radar_normativo telegram \
            --input /tmp/radar-finanziario-items.json \
            --ledger /tmp/radar-finanziario-ledger.json \
            --finance
